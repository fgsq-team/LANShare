<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
    <title>LANShare</title>
    <link rel="icon" href="favicon.ico" type="image/ico">
    <meta name="keywords" content="LANShare">
    <meta name="description" content="LANShare">
    <meta name="author" content="fgsq">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.min.css" rel="stylesheet">
    <link href="css/lanshare.css" rel="stylesheet">
    <link href="css/theme.css" rel="stylesheet">
    <link rel="preload" href="/images/no_network.png" as="image">
</head>

<body>
<div class="lyear-layout-web" style="display: none;">
    <div class="lyear-layout-container">
        <!-- 左侧导航 -->
        <aside class="lyear-layout-sidebar">
            <div id="logo" class="sidebar-header">
                <a href="/"><img src="images/lanshare.png" title="LANShare" alt="LANShare"/></a>
            </div>
            <div class="lyear-layout-sidebar-scroll">
                <nav class="sidebar-main">
                    <ul class="nav nav-drawer" id="sidebarNav">
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- 头部信息 -->
        <header class="lyear-layout-header">
            <nav class="navbar navbar-default">
                <div class="topbar">
                    <div class="topbar-left">
                        <div class="lyear-aside-toggler">
                            <span class="lyear-toggler-bar"></span>
                            <span class="lyear-toggler-bar"></span>
                            <span class="lyear-toggler-bar"></span>
                        </div>
                    </div>
                    <div class="topbar-center">
                        <input type="text" class="web-name" placeholder="设备名称">
                    </div>
                    <ul class="topbar-right">
                        <li class="dropdown dropdown-skin">
                            <button class="btn btn-success download-files"
                                    style="display: none;"
                                    onclick="downloadFiles()" type="button">下载文件(0)
                            </button>
                        </li>
                        <li class="dropdown dropdown-skin">
                            <button class="btn btn-success"
                                    onclick="showUploadDialog()" type="button">上传文件
                            </button>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <!-- 主要视图 -->
        <main class="lyear-layout-content">
            <div class="content-body">
                <!-- 文件列表 -->
                <div class="file-content" style="display:none">
                    <div class="card">
                        <div class="icard-header"><h4>文件列表</h4></div>
                        <div class="select-all-toolbar" id="fileSelectAllToolbar" style="display:none;">
                            <label class="select-all-label">
                                <input type="checkbox" id="fileSelectAllCheckbox" onchange="toggleSelectAll('file', this)">
                                <span>全选</span>
                            </label>
                        </div>
                        <div class="path-text">/</div>
                        <div class="icard-body"><div class="filelist"></div></div>
                    </div>
                </div>

                <!-- 媒体列表 -->
                <div class="media-select-all-wrapper" id="mediaSelectAllToolbar" style="display:none;">
                    <label class="select-all-label">
                        <input type="checkbox" id="mediaSelectAllCheckbox" onchange="toggleSelectAll('media', this)">
                        <span>全选</span>
                    </label>
                </div>
                <div class="media-content" style="display:none"></div>

                <!-- 软件列表 -->
                <div class="app-content" style="display:none"></div>

                <!-- 聊天 -->
                <div class="chat-content" style="display:none">
                    <div class="chat_main">
                        <div class="line"></div>
                        <div class="chat-toolbar" id="chatToolbar" style="display:none;">
                            <label class="chat-toolbar-label">
                                <input type="checkbox" id="chatSelectAllCheckbox" onchange="toggleChatSelectAll(this)">
                                <span>全选</span>
                            </label>
                            <button class="chat-toolbar-btn" onclick="deleteSelectedMessages()">删除选中</button>
                            <button class="chat-toolbar-btn" onclick="toggleChatMultiSelect(false)">取消</button>
                        </div>
                        <div class="chat_content" id="chat_content"></div>
                        <div class="chat-setting-bar">
                            <label class="chat-no-save-label">
                                <input type="checkbox" id="chatNoSaveCheckbox">
                                <span>不保存消息</span>
                            </label>
                        </div>
                        <div class="line"></div>
                        <div class="chat_foot">
                            <label>
                                <select class="device_selector">
                                    <option value="0">所有设备</option>
                                </select>
                            </label>
                            <textarea class="chat_context_edit" id="chat_context_edit"
                                      oninput="this.style.height='40px';this.style.height=this.scrollHeight+'px';"></textarea>
                            <div class="send_massage" id="send_massage">发送</div>
                        </div>
                    </div>
                </div>

                <!-- 远程绘图 -->
                <div class="draw-content" style="display:none">
                    <div class="draw-container">
                        <div class="draw-toolbar">
                            <span class="draw-tool-label">颜色:</span>
                            <input type="color" id="drawColorPicker" class="draw-color-input" value="#ff0000">
                            <span class="draw-tool-label">粗细:</span>
                            <input type="range" id="drawStrokeRange" class="draw-stroke-range" min="1" max="20" value="3">
                            <button class="draw-btn draw-btn-clear" onclick="clearDrawCanvas()">清空画布</button>
                            <span class="draw-status" id="draw_status">可在画布上直接绘图，同步到APP</span>
                        </div>
                        <div class="draw-canvas-wrapper">
                            <canvas id="drawCanvas"></canvas>
                            <canvas id="drawRemoteCanvas"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- 权限提示弹窗 -->
<div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="myModalLabel">提示</h4>
            </div>
            <div class="modal-body">没有访问权限，请在手机上同意之后刷新页面</div>
        </div>
    </div>
</div>

<!-- 上传文件弹窗 -->
<div class="modal fade" id="uploadFileDialog" tabindex="-1" role="dialog" aria-labelledby="uploadFileDialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="myUploadFileDialogLabel">上传文件</h4>
            </div>
            <div class="modal-body">
                <form id="uploadFileForm" action="/uploadFile" method="post" enctype="multipart/form-data" target="frameName">
                    <input id='select-file' class="form-control" onclick="$('#displayFile').click();" placeholder="点击选择文件或者拖拽文件到此处"/>
                    <input type="file" name="file" id='displayFile' accept="*" style="display: none">
                </form>
                <iframe name="frameName" id="frameName" style="display: none;"></iframe>
            </div>
        </div>
    </div>
</div>

<!-- 上传成功弹窗 -->
<div class="modal fade" id="uploadSuccessDialog" tabindex="-1" role="dialog" aria-labelledby="uploadSuccessDialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="uploadSuccessLabel">提示</h4>
            </div>
            <div class="modal-body">文件上传成功!</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<!-- 聊天拖拽上传 -->
<div class="modal" id="chatUploadModal" style="display:none;">
    <div class="upload_tips">松手上传文件</div>
</div>

<!-- 断连提示 -->
<div class="modal" id="notConnectedModal" style="display:none;">
    <div class="not_connected">连接断开，请启动LANShare后刷新页面</div>
    <div class="not_connected_img"></div>
</div>

<!-- 设备选择弹窗 -->
<div class="modal fade" id="devSelectDialog" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title">请选择一个设备</h4>
            </div>
            <div class="modal-body">
                <table class="table table-bordered">
                    <thead><tr><th>设备名</th><th>IP</th></tr></thead>
                    <tbody class="select_send_device"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 右键菜单 -->
<div class="context-menu"></div>

<script type="text/javascript" src="js/jquery.min.js"></script>
<script type="text/javascript" src="js/bootstrap.min.js"></script>
<script type="text/javascript" src="js/perfect-scrollbar.min.js"></script>
<script type="text/javascript" src="js/main.min.js"></script>
<script type="text/javascript" src="js/request.min.js"></script>
<script type="text/javascript" src="js/bootstrap-notify.min.js"></script>
<script type="text/javascript" src="js/lightyear.min.js"></script>
<script type="text/javascript" src="js/WSCmd.js"></script>
<script type="text/javascript" src="js/lanshareChat.js"></script>
<script type="text/javascript" src="js/lanshare.js"></script>
</body>
</html>
