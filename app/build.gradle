apply plugin: 'com.android.application'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.fgsqw.lanshare"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2601007
        versionName "1.3.0"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            //混淆开关
            minifyEnabled true
            // 是否zip对齐
            zipAlignEnabled true
            // 移除无用的resource文件
            shrinkResources true
            // 是否打开debuggable开关
            debuggable false
            // 是否打开jniDebuggable开关
            jniDebuggable false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        /*  debug {
              minifyEnabled true
              // 去除无用资源
              shrinkResources true
              proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
          }*/
    }
    compileOptions {

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
//    buildToolsVersion  rootProject.ext.buildToolsVersion
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def date = new Date().format("yyyy_MM_dd_hh_mm", TimeZone.getTimeZone("GMT+08"))
            if (variant.buildType.name == "debug") {
                output.outputFileName = "${date}_arbitrator_v${android.defaultConfig.versionName}_debug_${android.defaultConfig.versionCode}.apk"
            } else if (variant.buildType.name == "release") {
                output.outputFileName = "LANShare_${android.defaultConfig.versionName}.apk"
            }
        }
    }
    packagingOptions {
        // 排除特定文件
        exclude 'META-INF/**'
        // 排除特定文件或文件夹
        exclude 'org/**'
    }
}

dependencies {
    // UI库
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.4.0'
    // 遍历Android/data专用包
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // 阿里巴巴json工具
    implementation 'com.alibaba:fastjson:1.1.55.android'
    // 图片加载
    // 如果不需要完整的Glide功能，可以排除部分模块
    implementation ('com.github.bumptech.glide:glide:4.9.0') {
        exclude group: 'com.android.support'
    }    // 图片预览
    implementation 'com.github.chrisbanes.photoview:library:1.2.4'
    // 二维码扫描
    implementation 'com.journeyapps:zxing-android-embedded:3.6.0'
    // 权限申请框架
    implementation 'com.github.getActivity:XXPermissions:16.6'
    // 日志框架
    implementation 'com.github.tony19:logback-android:2.0.0'
    // 日志框架
    implementation 'org.slf4j:slf4j-api:1.7.30'
    // 工具
    implementation 'commons-codec:commons-codec:1.15'
    // 视频预览
    implementation project(':mnvideoplayerlibrary')
    implementation fileTree(dir: 'libs', includes: ['*.jar'])

}
