<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>列表示例</title>
    <style>ol {
        text-align: left;
        padding: 0;
        margin: 0
    }

    h1 {
        font-size: 24px
    }

    li {
        font-size: 18px;
        margin-bottom: 15px
    }

    div.usage {
        font-size: 14px;
        margin-top: 5px;
        margin-left: 20px
    }</style>
</head>
<body><h1>版本：V1.2.2</h1>
<ol>
    <li>新增文件排序功能
    </li>
    <li>新增文件搜索功能
    </li>
    <li>文件搜索界面新增搜索分类选择
    </li>
    <li>新增消息多选删除功能
    </li>
    <li>暂时删除【通知同步】和【来电禁音同步】功能
        <div class="usage">软件被报毒感觉是因为这两个权限以引起的，所以暂时删除看看能否解决报毒问题</div>
    </li>
    <li>优化更新弹弹窗以及一些其他问题</li>
</ol>
